# Local infrastructure for CONNECTOR_MODE=local.
#   docker compose up -d && npm run seed:local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eraseops
      POSTGRES_PASSWORD: eraseops_local_only
      POSTGRES_DB: eraseops
    ports: ['5432:5432']
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eraseops -d eraseops']
      interval: 2s
      retries: 30
  minio:
    # MinIO no longer publishes images to Docker Hub or Quay; the Bitnami build is still public
    # and creates the allowlisted buckets on start.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: eraseops
      MINIO_ROOT_PASSWORD: eraseops_local_only
      MINIO_DEFAULT_BUCKETS: customer-uploads,support-attachments,exports,eraseops-backups
    ports: ['9000:9000', '9001:9001']
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 2s
      retries: 30
